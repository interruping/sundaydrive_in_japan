<svg data-question-id="entry-13" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 520" role="img" aria-labelledby="scene-title" data-scenario-feature="yielding-blindspot"><title id="scene-title">맞은편 차가 양보해 줬어요. 오른쪽 가게로 들어갈까요?. 오른쪽 가게 입구. 맞은편 차는 정차해 양보 중이며, 그 차의 도로 가장자리 쪽으로 오토바이가 직진해 옴. 산호색 점선은 내 차가 진입하려는 경로.. 황색 실선 중앙선의 왕복 2차로. 목적지는 오른쪽. 입구에 인도 없음. 맞은편 차는 멈춰 양보하고, 그 차 옆의 오토바이는 접근 중</title><rect width="560" height="520" rx="18" fill="#d6e3ce"/><g data-road-layout="two-way-two-lane" data-center-line="yellow" data-has-sidewalk="false"><rect x="170" width="220" height="520" fill="#b8c7bc"/><path d="M280 0V520" fill="none" stroke="#efbd4d" stroke-width="5" data-centerline="yellow-solid"/><path d="M173 0V520M387 0V330M387 410V520" fill="none" stroke="#fffef7" stroke-width="3" /></g><g data-driveway="right"><rect x="410" y="310" width="143" height="170" rx="6" fill="#d1d5c6"/><rect x="390" y="330" width="163" height="80" fill="#c9cfc1"/><path d="M390 330H553M390 410H553" fill="none" stroke="#a9b7a6" stroke-width="2" /><g data-destination="true"><rect x="423" y="239" width="112" height="73" rx="4" fill="#f1ead4"/><path d="M418 244h122v19H418Z" fill="#347b69"/><path d="M435 275h27v24h-27ZM496 275h27v24h-27Z" fill="#a9c8c1"/><path d="M469 278h20v34h-20Z" fill="#6b8e83"/><path d="M479 233l-10 -15a14 14 0 1 1 20 0Z" fill="#e67855"/><circle cx="479" cy="209" r="5" fill="#fffef7"/><rect x="431" y="166" width="96" height="30" rx="7" fill="#fffef7"/><text x="479" y="188" font-family="Pretendard, 'Noto Sans KR', sans-serif" font-size="21" font-weight="750" fill="#173e38" text-anchor="middle">목적지</text></g><path d="M425 423v36h48v-36m12 0v36h48v-36" fill="none" stroke="#fffef7" stroke-width="3"/></g><g data-intended-route="right" data-route-style="not-road-marking"><path d="M225 420V392Q225 370 250 370H473" fill="none" stroke="#e67855" stroke-width="4" stroke-dasharray="9 8"/><g transform="translate(474 370) rotate(90) scale(0.65)"><path d="M0 21V-20M-12 -7L0 -20 12 -7" fill="none